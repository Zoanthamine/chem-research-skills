name: Skill package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify package and installer
        run: |
          python install.py --check
          python -m unittest discover -s tests
      - name: Install numerical test dependencies
        run: python -m pip install numpy scipy matplotlib gemmi requests rdkit
      - name: Single crystal helper regression tests
        run: python -m unittest discover -s skills/scxrd-refinement/scripts -p "test_*.py"
      - name: Spectrum numerical examples
        run: python skills/huangjt-spectral-structure-analysis/scripts/evidence_cli.py selftest
      - name: Standalone skill and structure round-trip checks
        run: python -m unittest discover -s tests -p "test_library_portability.py"
