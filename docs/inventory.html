const q = document.getElementById('q'), area = document.getElementById('area'),
      kind = document.getElementById('kind'), tbody = document.getElementById('rows'),
      count = document.getElementById('count');
document.getElementById('total').textContent = DATA.length;
function esc(s){return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(){
  const needle = q.value.trim().toLowerCase();
  const rows = DATA.filter(r => (!area.value || r.area === area.value) &&
      (!kind.value || r.kind === kind.value) &&
      (!needle || (r.path + ' ' + r.description).toLowerCase().includes(needle)));
  count.textContent = rows.length + ' / ' + DATA.length;
  tbody.innerHTML = rows.slice(0, 1500).map(r =>
    '<tr><td class="path">' + esc(r.path) + '</td><td>' + esc(r.area) + '</td><td>' +
    esc(r.kind) + (r.runs ? '<span class="tag">可运行</span>' : '') + '</td><td>' +
    esc(r.runs ? '是' : '') + '</td><td class="desc">' + esc(r.description) + '</td></tr>'
  ).join('') + (rows.length > 1500 ? '<tr><td colspan="5">仅显示前 1500 行，请用筛选缩小范围。</td></tr>' : '');
}
[q, area, kind].forEach(el => el.addEventListener('input', render));
render();
